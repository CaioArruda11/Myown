.bsc{--d0:#050E26;--d1:#0A1A42;--d2:#123A7C;--a1:#22D3EE;--a2:#60A5FA;--g1:rgba(34,211,238,.22);--g2:rgba(59,130,246,.30);--pri:#2563EB;--pri-b:#E9F0FF;--ink:#0B1533;--ink2:#3F4C6B;--mut:#63708B;--ln:#E1E6EF;--ln2:#EDF0F6;--sf:#FFFFFF;--sf2:#F5F7FB;
--ok:#0E9F6E;--ok-t:#04704B;--wa:#E0A100;--wa-t:#7A5600;--ri:#F27321;--ri-t:#9A3D06;--ba:#E5383B;--ba-t:#B01E22;--nd:#C2CAD8;
--c:var(--pri);--s:var(--nd);--st:var(--mut);--ease:cubic-bezier(.2,.8,.2,1);
--cols:minmax(0,1fr) 56px 68px 126px 48px 36px;
width:100%;height:100vh;overflow:hidden;padding:8px;display:grid;grid-template-rows:auto minmax(0,1fr);gap:10px;
font-family:'Segoe UI',system-ui,-apple-system,Arial,sans-serif;font-size:12px;line-height:1.2;text-align:left;color:var(--ink);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}

/* ---------- IDENTIDADE DAS CORES ---------- */
.c-geral{--c:var(--pri)}.c-ouro{--c:#E2B33C}.c-bronze{--c:#C9804F}.c-prata1{--c:#7F95B8}.c-prata2{--c:#B4C0D4}

/* ---------- ESCALA DE STATUS ---------- */
/* sobre fundo claro */
.green{--s:var(--ok);--st:var(--ok-t)}.yellow{--s:var(--wa);--st:var(--wa-t)}.orange{--s:var(--ri);--st:var(--ri-t)}.red{--s:var(--ba);--st:var(--ba-t)}.neutral{--s:var(--nd);--st:var(--mut)}
/* sobre fundo escuro */
.d-green{--s:#34D399}.d-yellow{--s:#FBBF24}.d-orange{--s:#FB923C}.d-red{--s:#F87171}.d-neutral{--s:#94A3B8}
.m-green{background:#34D399}.m-yellow{background:#FBBF24}.m-orange{background:#FB923C}.m-red{background:#F87171}.m-neutral{background:rgba(255,255,255,.22)}

/* =====================================================================
   FAIXA DE DESTAQUE
   ===================================================================== */
.hero{position:relative;display:grid;grid-template-columns:minmax(0,1.24fr) minmax(0,.82fr) minmax(0,1.28fr);padding:13px 4px;overflow:hidden;border-radius:18px;color:#FFFFFF;
background:radial-gradient(70% 150% at 0% 0%,var(--g2),transparent 62%),radial-gradient(60% 140% at 100% 110%,var(--g1),transparent 60%),linear-gradient(115deg,var(--d1),var(--d0));
box-shadow:0 10px 26px rgba(5,14,38,.22),inset 0 0 0 1px rgba(255,255,255,.08)}
.hero::before{content:'';position:absolute;left:0;top:0;right:0;bottom:0;background-image:radial-gradient(rgba(255,255,255,.10) 1px,transparent 1.3px);background-size:16px 16px;opacity:.45;pointer-events:none}
.hero::after{content:'';position:absolute;top:-40%;bottom:-40%;left:-30%;width:24%;transform:skewX(-18deg);background:linear-gradient(90deg,transparent,rgba(255,255,255,.07),transparent);animation:drift 11s ease-in-out infinite;pointer-events:none}
.hz{position:relative;z-index:1;min-width:0;padding:0 16px;display:flex;flex-direction:column;justify-content:space-between;gap:4px}
.hz+.hz{border-left:1px solid rgba(255,255,255,.11)}
.hz-t{display:flex;align-items:center;justify-content:space-between;gap:8px;height:14px;margin-bottom:2px;font-size:9px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:rgba(255,255,255,.62);white-space:nowrap}
.hz-t span+span{font-size:9.5px;font-weight:500;letter-spacing:.02em;text-transform:none}

/* ---- velocimetro ---- */
.gz{flex-direction:row;align-items:center;justify-content:flex-start;gap:14px}
.gauge{position:relative;flex:none;width:182px;height:102px}
.gauge svg{display:block;width:100%;height:100%;overflow:visible}
.gauge path{fill:none}
.g-z{stroke-width:3}
.g-z1{stroke:#F87171;stroke-dasharray:181.7 600}.g-z2{stroke:#FB923C;stroke-dasharray:0 183.7 21.0 600}.g-z3{stroke:#FBBF24;stroke-dasharray:0 206.7 21.0 600}.g-z4{stroke:#34D399;stroke-dasharray:0 229.6 68.9 600}
.g-t{stroke:rgba(255,255,255,.13);stroke-width:14;stroke-linecap:round}
.g-f{stroke:var(--s);stroke-width:14;stroke-linecap:round;stroke-dasharray:134.3 600;animation:arc 1.1s var(--ease) both}
.g-m{stroke:#FFFFFF;stroke-width:2.5;stroke-linecap:round;transform-origin:100px 100px;transform:rotate(138.5deg)}
.g-r{fill:var(--d0);stroke:#FFFFFF;stroke-width:2.5;transform-origin:100px 100px;transform:rotate(91.6deg)}
.g-v{position:absolute;left:0;right:0;bottom:-2px;text-align:center}
.g-v b{display:block;font-size:33px;font-weight:700;letter-spacing:-.03em;line-height:1}
.g-v small{display:block;margin-top:3px;font-size:10px;font-weight:500;color:rgba(255,255,255,.68)}
.gt{min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:4px}
.gt-e{font-size:15px;font-weight:700;letter-spacing:-.01em;white-space:nowrap}
.gt-s{font-size:10px;color:rgba(255,255,255,.68);white-space:nowrap}
.chip{display:inline-flex;align-items:center;height:20px;margin:2px 0 1px;padding:0 9px;border-radius:99px;font-size:10.5px;font-weight:700;color:var(--d0);background:var(--s);white-space:nowrap}
.gt-l{font-size:10.5px;color:rgba(255,255,255,.80);white-space:nowrap}
.gt-l b{color:#FFFFFF;font-weight:700}
.gt-l .up,.bd-d.up{color:#6EE7B7}.gt-l .down,.bd-d.down{color:#FCA5A5}
.rf{display:inline-block;width:8px;height:8px;margin-right:5px;border-radius:50%;border:2px solid #FFFFFF;vertical-align:-1px}

/* ---- composicao ---- */
.cg{display:grid;grid-template-columns:60px minmax(0,1fr) auto;align-items:center;column-gap:8px;height:19px}
.cg-n{font-size:11px;font-weight:650;white-space:nowrap}
.cg-b{grid-column:2;grid-row:1;position:relative;height:6px;border-radius:99px;background:rgba(255,255,255,.14)}
.cg-v{grid-column:3;grid-row:1;font-size:10.5px;color:rgba(255,255,255,.70);white-space:nowrap}
.cg-v b{color:#FFFFFF;font-size:12px;font-weight:700}
.cg-b u,.bd-b u,.bul u{display:block;width:var(--w,0%);max-width:100%;height:100%;border-radius:99px;transform-origin:0 50%;animation:grow .8s var(--ease) both}
.cg-b u{background:var(--s)}
.cg-b::after{content:'';position:absolute;left:76.9%;top:-3px;bottom:-3px;width:1.5px;margin-left:-.75px;background:#FFFFFF;opacity:.9}
.mos{display:flex;gap:3px;margin-top:4px}
.mz{flex:1 1 0;height:13px;border-radius:4px;transition:transform .12s ease}
.mos .mz:hover{transform:scale(1.25)}
.mz.q{margin-left:6px}
.mos-l{display:flex;gap:11px;font-size:9.5px;color:rgba(255,255,255,.74)}
.mos-l span{display:inline-flex;align-items:center;gap:4px}
.mos-l .mz{flex:none;width:8px;height:8px;border-radius:2px}

/* ---- ranking das cores ---- */
.bd{display:grid;grid-template-columns:18px 108px minmax(0,1fr) 42px 42px;align-items:center;column-gap:8px;height:20px;margin:0 -6px;padding:0 6px;border-radius:7px;transition:opacity .2s ease,background .2s ease}
.bd:hover{background:rgba(255,255,255,.07)}
.bd-p{font-size:10.5px;font-weight:700;color:rgba(255,255,255,.62)}
.bd-n{display:flex;align-items:center;gap:6px;min-width:0;font-size:11px;font-weight:700;letter-spacing:.04em;white-space:nowrap;overflow:hidden}
.bd-n small{font-size:9.5px;font-weight:500;letter-spacing:0;color:rgba(255,255,255,.58)}
.sw{flex:none;width:8px;height:8px;border-radius:50%;background:var(--c)}
.bd-b{position:relative;height:8px;border-radius:99px;background:rgba(255,255,255,.12)}
.bd-b u{background:var(--c)}
.bd-b::before{content:'';position:absolute;z-index:1;left:50.9%;top:-9px;bottom:-9px;width:0;border-left:1.5px dashed rgba(255,255,255,.80)}
.bd-b::after{content:'';position:absolute;z-index:1;left:76.9%;top:-9px;bottom:-9px;width:1.5px;margin-left:-.75px;background:#FFFFFF}
.bd-v{text-align:right;font-size:12.5px;font-weight:700}
.bd-d{text-align:right;font-size:10.5px;font-weight:700;white-space:nowrap}
.bd-d.nd{color:rgba(255,255,255,.5);font-weight:500;font-size:9px}
.bd.on{background:rgba(255,255,255,.11);box-shadow:inset 0 0 0 1px rgba(255,255,255,.26)}
.hz.focus .bd:not(.on){opacity:.5}
.hz.focus .bd:hover{opacity:1}
.gd i{display:inline-block;height:9px;margin:0 4px 0 9px;vertical-align:-1px}
.gd-g{border-left:1.5px dashed rgba(255,255,255,.80)}.gd-m{border-left:1.5px solid #FFFFFF}

/* =====================================================================
   PAINEIS CLAROS
   ===================================================================== */
.content{min-height:0;display:grid;grid-template-columns:minmax(0,1.82fr) minmax(300px,1fr);gap:10px}
.panel{position:relative;min-width:0;min-height:0;display:flex;flex-direction:column;overflow:hidden;border-radius:16px;background:var(--sf);border:1px solid var(--ln);box-shadow:0 1px 2px rgba(11,21,51,.04),0 6px 16px rgba(11,21,51,.05)}
.ph{position:relative;z-index:5;flex:none;display:flex;align-items:center;gap:8px;height:44px;padding:0 12px 0 16px;border-bottom:1px solid var(--ln2)}
.ph h2{flex:none;margin:0;font-size:14px;font-weight:700;letter-spacing:-.01em;line-height:1.2;color:var(--ink);white-space:nowrap}
.cx{flex:none;display:inline-flex;align-items:center;height:18px;padding:0 8px;border-radius:99px;background:var(--pri-b);color:var(--pri);font-size:9.5px;font-weight:700;letter-spacing:.04em;white-space:nowrap}
.ins{flex:1 1 auto;min-width:0;font-size:10.5px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ins b{color:var(--ink2);font-weight:650}

/* botao de duas posicoes (<details>): fechado = 1a opcao, aberto = 2a */
.tg{flex:none}
.tg summary{display:flex;padding:2px;border-radius:9px;background:var(--sf2);border:1px solid var(--ln);cursor:pointer;outline:none;-webkit-user-select:none;user-select:none}
.tg span{display:flex;align-items:center;height:20px;padding:0 9px;border-radius:7px;font-size:10.5px;font-weight:650;color:var(--mut);white-space:nowrap;transition:background .15s ease,color .15s ease}
.tg:not([open]) .a,.tg[open] .b{background:var(--sf);color:var(--pri);box-shadow:0 1px 2px rgba(11,21,51,.14)}
.tg summary:hover span{color:var(--ink)}
.tg:not([open]) summary:hover .a,.tg[open] summary:hover .b{color:var(--pri)}
.tg summary:focus-visible{outline:2px solid var(--pri);outline-offset:1px}

/* ajuda (?): abre com o mouse em cima ou com um clique (foco) */
.help{position:relative;flex:none;outline:none}
.help-b{width:22px;height:22px;display:flex;align-items:center;justify-content:center;border-radius:50%;border:1px solid var(--ln);background:var(--sf2);color:var(--ink2);font-size:11px;font-weight:700;cursor:help;transition:background .15s ease,color .15s ease,border-color .15s ease}
.help:hover .help-b,.help:focus-within .help-b{background:var(--pri);border-color:var(--pri);color:#FFFFFF}
.help-pop{position:absolute;right:0;top:29px;width:292px;padding:12px 13px 11px;border-radius:12px;background:var(--d0);color:#D5DBEA;box-shadow:0 12px 28px rgba(5,14,38,.34);font-size:10.5px;line-height:1.4;opacity:0;visibility:hidden;transform:translateY(-4px);transition:opacity .16s ease,transform .16s ease,visibility .16s}
.help:hover .help-pop,.help:focus-within .help-pop{opacity:1;visibility:visible;transform:none}
.help-pop b{display:block;margin-bottom:6px;color:#FFFFFF;font-size:11.5px;font-weight:700}
.help-pop p{margin:0 0 6px}
.help-pop .k{display:block;color:var(--a1);font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.help-esc{display:flex;gap:4px;margin:9px 0 0!important}
.help-esc .e{flex:1 1 0;height:18px;display:flex;align-items:center;justify-content:center;border-radius:5px;color:#06102B;font-size:9.5px;font-weight:700}

/* ---------- INDICADORES ---------- */
.th,.row{display:grid;grid-template-columns:var(--cols);align-items:center;column-gap:8px;padding:0 14px 0 12px}
.th{flex:none;height:24px;background:var(--sf2);border-bottom:1px solid var(--ln);color:var(--mut);font-size:8.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;transition:color .15s ease}
.th span{text-align:right}
.th span:first-child{padding-left:16px;text-align:left}
.rows{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;padding:2px 0 4px;overflow-y:auto;overflow-x:hidden;scrollbar-width:thin;scrollbar-color:#D3D9E4 transparent}
.grp{flex:none;height:19px;display:flex;align-items:center;gap:8px;padding:0 14px 0 12px;color:var(--pri);font-size:8.5px;font-weight:800;letter-spacing:.12em;white-space:nowrap}
.grp i{flex:1 1 auto;height:1px;background:var(--ln)}
.grp small{color:var(--mut);font-size:10px;font-weight:500;letter-spacing:0}
.grp small b{color:var(--ink);font-weight:700}
.row{flex:1 1 23px;min-height:23px;max-height:40px;transition:background .15s ease}
.row:hover{background:var(--sf2)}
.c-nm{min-width:0;display:flex;align-items:center;gap:8px}
.st{flex:none;width:8px;height:8px;border-radius:3px;background:var(--s)}
/* se faltar espaco, a etiqueta encolhe antes do nome */
.nm{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;font-size:12px;font-weight:600;color:var(--ink);white-space:nowrap}
.tag{flex:0 100 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;color:var(--mut);font-size:9.5px;font-weight:500;white-space:nowrap}
.n{text-align:right;font-size:11.5px;font-weight:500;color:var(--ink2);white-space:nowrap}
.n.real{color:var(--ink);font-weight:700}
.n i{margin-right:3px;color:#8E99AE;font-size:10.5px}
.n.pts b{color:var(--ink);font-weight:700}
.n.pts small{color:var(--mut);font-size:10px;font-weight:500}
.sd{font-weight:700}
.sd.down{color:var(--ba-t)}.sd.up{color:var(--ok-t)}.sd.eq{color:#8E99AE;font-weight:500}
/* grafico de bala: fundo em 3 zonas (ate 80% | ate a meta | acima), barra = atingimento, traco = meta */
.atg{display:flex;align-items:center;gap:8px}
.bul{position:relative;flex:1 1 auto;height:9px;border-radius:3px;background:linear-gradient(90deg,#D6DCE7 0 61.5%,#E5E9F0 61.5% 76.9%,#F1F3F7 76.9% 100%)}
.bul u{position:absolute;left:0;top:2.5px;height:4px;border-radius:2px;background:var(--s)}
.bul::after{content:'';position:absolute;left:76.9%;top:-2px;bottom:-2px;width:2px;margin-left:-1px;border-radius:1px;background:var(--ink)}
.pc{flex:none;width:58px;text-align:right;font-size:11px;font-weight:700;color:var(--st);white-space:nowrap}
.row.neutral .nm{color:#7A869F}
.row.neutral .n,.row.neutral .n.real,.row.neutral .n.pts b{color:#98A2B6;font-weight:500}
.row.neutral .pc{font-size:10px;font-weight:600}
.row.neutral .bul{background:repeating-linear-gradient(90deg,#E1E6EE 0 3px,transparent 3px 6px)}
.row.neutral .bul::after{display:none}

/* ---------- ATS: DISPERSAO ---------- */
.sp{flex:none;padding:9px 16px 5px;border-bottom:1px solid var(--ln2)}
.sp-t{display:flex;justify-content:space-between;gap:10px;color:var(--mut);font-size:8.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;white-space:nowrap}
.sp-t span+span{min-width:0;overflow:hidden;text-overflow:ellipsis;font-size:10px;font-weight:500;letter-spacing:0;text-transform:none}
.sp-t b{color:var(--ink2);font-weight:700}
.sp-a{position:relative;height:38px;margin:3px 7px 0}
.sp-a::before{content:'';position:absolute;left:-7px;right:-7px;top:50%;height:2px;margin-top:-1px;border-radius:2px;background:var(--ln)}
.dot{position:absolute;left:calc(var(--x,50)*1%);top:50%;width:11px;height:11px;margin:-5.5px 0 0 -5.5px;border-radius:50%;background:var(--c);box-shadow:0 0 0 1.5px #FFFFFF,0 1px 3px rgba(11,21,51,.30);transition:transform .15s ease,opacity .15s ease;animation:pop .5s var(--ease) backwards}
.dot.y0{margin-top:-13px}.dot.y2{margin-top:2px}
.dot:hover{transform:scale(1.45);z-index:3}
.dot.sel{z-index:2;box-shadow:0 0 0 2px #FFFFFF,0 0 0 4.5px var(--pri)}
.sp-g{position:absolute;left:calc(var(--x,50)*1%);top:-1px;bottom:-1px;width:0;border-left:1.5px dashed var(--pri)}
.sp-m{display:inline-block;height:9px;margin-right:5px;border-left:1.5px dashed var(--pri);vertical-align:-1px}
.sp-l{display:flex;justify-content:space-between;color:var(--mut);font-size:9.5px}

/* ---------- ATS: RANKING ---------- */
.ats{flex:1 1 auto;min-height:0;display:grid;grid-auto-flow:column;grid-template-columns:minmax(0,1fr);grid-template-rows:repeat(9,minmax(22px,34px));align-content:start;gap:0 12px;padding:3px 10px 8px;overflow-y:auto;overflow-x:hidden;scrollbar-width:thin;scrollbar-color:#D3D9E4 transparent}
.ats.c2{grid-template-columns:repeat(2,minmax(0,1fr))}
.at{min-width:0;display:flex;align-items:center;gap:6px;padding:0 4px;border-bottom:1px solid var(--ln2);border-radius:7px;transition:background .15s ease,opacity .15s ease}
.at:hover{background:var(--sf2)}
.rk{flex:none;width:18px;height:18px;display:flex;align-items:center;justify-content:center;border-radius:50%;border:1.5px solid var(--c);background:#FFFFFF;color:var(--ink2);font-size:9px;font-weight:700}
.at-n{font-size:12.5px;font-weight:700;color:var(--ink)}
.at-c{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;color:var(--mut);font-size:8.5px;font-weight:600;letter-spacing:.06em;white-space:nowrap}
.c2 .at-c{visibility:hidden;font-size:0}
.at-p{font-size:11.5px;font-weight:700;color:var(--ink)}
.at .pc{width:42px;font-size:10.5px}
.at.sel{background:var(--pri-b);box-shadow:inset 0 0 0 1px var(--pri);border-bottom-color:transparent}
.ats.focus .at:not(.sel){opacity:.5}
.ats.focus .at:hover{opacity:1}
.empty{margin:auto;padding:24px 16px;text-align:center;color:var(--mut);font-size:11px;line-height:1.4}
.empty b{display:block;margin-bottom:4px;color:var(--ink);font-size:12.5px;font-weight:700}

/* ---------- ATS: MAPA DE CALOR (AT x indicador) ---------- */
.map{display:none;flex:1 1 auto;min-height:0;flex-direction:column;padding:7px 12px 8px}
.mr{display:grid;grid-template-columns:16px 24px repeat(10,minmax(0,1fr)) 32px;align-items:center;column-gap:3px;padding:0 4px;transition:opacity .15s ease}
.mh{flex:none;height:17px;color:var(--mut);font-size:7.5px;font-weight:700;letter-spacing:.02em;text-align:center}
.map-b{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:2px;overflow-y:auto;overflow-x:hidden;scrollbar-width:thin}
.map-b .mr{flex:1 1 15px;min-height:15px;max-height:26px}
.mr .rk{width:15px;height:15px;font-size:8px}
.mr-n{font-size:11px;font-weight:700;color:var(--ink)}
.mr-t{text-align:right;color:var(--ink2);font-size:10.5px;font-weight:700}
.mh .mr-t{font-size:7.5px;color:var(--mut);text-transform:uppercase}
.hc{align-self:stretch;min-height:11px;border-radius:4px;transition:transform .12s ease}
.h0{background:repeating-linear-gradient(135deg,#EEF1F6 0 3px,#E2E7EF 3px 6px)}.h1{background:#F0787B}.h2{background:#F8A468}.h3{background:#F4CE58}.h4{background:#3BC892}
.map-b .hc:hover{transform:scale(1.22);box-shadow:0 0 0 1.5px var(--ink)}
.mr.sel{border-radius:6px;background:var(--pri-b);box-shadow:0 0 0 1px var(--pri)}
.map-l{flex:none;display:flex;justify-content:center;gap:11px;margin-top:7px;color:var(--mut);font-size:9px}
.map-l span{display:inline-flex;align-items:center;gap:4px}
.map-l .hc{align-self:auto;width:9px;height:9px;min-height:0;border-radius:2px}

/* ---------- ESTADO DOS BOTOES ---------- */
/* Maior perda: reordena as linhas pelo saldo e esconde os divisores de grupo */
.panel:has(.tg-sort[open]) .row{order:var(--o)}
.panel:has(.tg-sort[open]) .grp{display:none}
.panel:has(.tg-sort[open]) .c-sd{color:var(--pri)}
/* Mapa de calor: troca dispersao + ranking pelo mapa */
.panel:has(.tg-map[open]) .map{display:flex}
.panel:has(.tg-map[open]) .sp,.panel:has(.tg-map[open]) .ats{display:none}
/* mouse em uma cor no topo: destaca as ATs daquela cor */
.bsc:has(.bd.c-ouro:hover) .at:not(.c-ouro),.bsc:has(.bd.c-ouro:hover) .dot:not(.c-ouro),.bsc:has(.bd.c-ouro:hover) .map-b .mr:not(.c-ouro),
