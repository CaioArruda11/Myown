.track u{background:var(--c)}
.track::after,.bul::after{content:'';position:absolute;left:76.9%;top:-3px;bottom:-3px;width:1.5px;margin-left:-.75px;border-radius:2px;background:var(--ink);opacity:.32}
.card-foot{display:flex;align-items:center;gap:4px;min-width:0;height:18px;margin-top:8px;font-size:10.5px;color:var(--mut);white-space:nowrap}
.card-foot b{color:var(--ink2);font-weight:650}
.card-foot .vs{min-width:0;overflow:hidden;text-overflow:ellipsis}
.card-foot .pill{margin-left:auto;height:18px}
.delta{font-weight:650}.delta.up{color:#0B6B3A}.delta.down{color:#A01D2E}

/* card Geral: destaque com anel de atingimento (anel fechado = meta) */
.hero{display:flex;align-items:center;justify-content:space-between;gap:10px}
.hero-txt{min-width:0}
.hero .score{font-size:31px}
.hero .score small{font-size:11px;letter-spacing:0;text-transform:none}
.gauge{position:relative;flex:none;width:64px;height:64px;--g:var(--c)}
.gauge.green{--g:#12A150}.gauge.yellow{--g:#DDA80F}.gauge.orange{--g:#E8622C}.gauge.red{--g:#C5283D}.gauge.neutral{--g:#C3CBD6}
.ring{display:block;width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:3.6}
.ring-t{stroke:var(--ln2)}
.ring-f{stroke:var(--g);stroke-linecap:round;stroke-dasharray:var(--p,0) 100;animation:ring .9s var(--ease) both}
.gauge.neutral .ring-f{display:none}
.gauge-v{position:absolute;left:0;top:0;width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;letter-spacing:-.01em;color:var(--ink)}

/* ---------- PAINEIS ---------- */
.content{min-height:0;display:grid;grid-template-columns:minmax(0,1.78fr) minmax(270px,.72fr);gap:10px}
.panel{position:relative;min-width:0;min-height:0;display:flex;flex-direction:column;overflow:hidden;border-radius:14px;background:var(--sf);border:1px solid var(--ln);box-shadow:var(--sh)}
.ph{position:relative;z-index:5;flex:none;display:grid;grid-template-columns:minmax(0,1fr) auto auto;align-items:center;column-gap:12px;row-gap:3px;padding:10px 12px 9px 16px;border-bottom:1px solid var(--ln2)}
.ph h2{margin:0;font-size:14px;font-weight:650;letter-spacing:-.01em;line-height:1.2;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{grid-column:1 / -1;margin:0;font-size:10.5px;line-height:1.25;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub b{color:var(--ink2);font-weight:650}
.legend{display:flex;align-items:center;gap:10px}
.lg{display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:500;color:var(--ink2);white-space:nowrap}
.lg i{width:7px;height:7px;border-radius:2px}
.lg b{color:var(--ink);font-weight:700}
.lg.zero{opacity:.45}

/* ajuda (?): abre com o mouse em cima ou com um clique (foco) */
.help{position:relative;outline:none}
.help-b{width:20px;height:20px;display:flex;align-items:center;justify-content:center;border-radius:50%;border:1px solid var(--ln);background:var(--sf2);color:var(--ink2);font-size:11px;font-weight:700;cursor:help;transition:background .15s ease,color .15s ease,border-color .15s ease}
.help:hover .help-b,.help:focus-within .help-b{background:var(--pri);border-color:var(--pri);color:#FFFFFF}
.help-pop{position:absolute;right:0;top:27px;width:286px;padding:12px 13px 11px;border-radius:12px;background:#101828;color:#E4E7EC;box-shadow:0 12px 28px rgba(16,24,40,.28);font-size:10.5px;line-height:1.4;opacity:0;visibility:hidden;transform:translateY(-4px);transition:opacity .16s ease,transform .16s ease,visibility .16s}
.help:hover .help-pop,.help:focus-within .help-pop{opacity:1;visibility:visible;transform:none}
.help-pop b{display:block;margin-bottom:6px;color:#FFFFFF;font-size:11.5px;font-weight:650}
.help-pop p{margin:0 0 6px;color:#D0D5DD}
.help-pop .k{display:block;color:#A5B4FC;font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.help-esc{display:flex;gap:4px;margin:9px 0 0!important}
.help-esc .pill{min-width:0;flex:1 1 0;padding:0 4px;font-size:9.5px}

/* ---------- TABELA DE INDICADORES (grid; as linhas dividem a altura livre) ---------- */
.th,.row{display:grid;grid-template-columns:var(--cols);align-items:center;column-gap:8px;padding:0 14px 0 16px}
.th{flex:none;height:26px;background:var(--sf2);border-bottom:1px solid var(--ln);color:var(--mut);font-size:9px;font-weight:650;letter-spacing:.07em;text-transform:uppercase}
.th span{text-align:right}.th span:first-child{text-align:left}
.rows{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;overflow-y:auto;overflow-x:hidden;scrollbar-width:thin;scrollbar-color:#D5DAE2 transparent}
.grp{position:sticky;top:0;z-index:2;flex:none;height:24px;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 14px 0 16px;background:var(--sf2);border-bottom:1px solid var(--ln2)}
.grp-name{display:flex;align-items:center;gap:7px;color:var(--ink2);font-size:9.5px;font-weight:700;letter-spacing:.1em}
.grp-name i{width:7px;height:7px;border-radius:2px;background:var(--pri)}
.grp.quality .grp-name i{background:var(--azul)}
.grp-name small{color:var(--mut);font-size:9.5px;font-weight:500;letter-spacing:.01em}
.grp-pts{color:var(--mut);font-size:10.5px;font-weight:500}.grp-pts b{color:var(--ink);font-weight:700}
.row{flex:1 1 24px;min-height:24px;max-height:44px;border-bottom:1px solid var(--ln2);transition:background .15s ease}
.row:hover{background:var(--sf2)}
.c-nm{min-width:0;display:flex;align-items:baseline;gap:7px}
.nm{min-width:0;font-size:12px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{flex:none;color:var(--mut);font-size:9.5px;font-weight:500}
.n{text-align:right;font-size:11.5px;font-weight:500;color:var(--ink2);white-space:nowrap}
.n.real{color:var(--ink);font-weight:700}
.n small{color:var(--mut);font-size:10px;font-weight:500}
.n i{margin-right:3px;color:#98A2B3;font-size:10.5px}
.atg{display:flex;align-items:center;justify-content:flex-end;gap:9px}
.bul{position:relative;flex:1 1 auto;max-width:94px;height:5px;border-radius:99px;background:var(--ln2)}
/* alerta abaixo de 80%: so um filete a esquerda (o selo e a barra ja sao vermelhos) */
.row.alerta{box-shadow:inset 2px 0 0 #C5283D}
/* sem dados: a linha recua */
.row.nodata .nm{color:#7C879B}
.row.nodata .n,.row.nodata .n.real{color:#98A2B3;font-weight:500}
.row.nodata .bul{background:repeating-linear-gradient(90deg,#DDE2EA 0 3px,transparent 3px 6px)}
.row.nodata .bul::after{display:none}

/* ---------- RANKING DE ATS ---------- */
.ats{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;padding:3px 6px 4px;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:#D5DAE2 transparent}
.at{position:relative;flex:1 1 22px;min-height:22px;max-height:38px;display:grid;grid-template-columns:18px minmax(0,1fr) auto 60px;align-items:center;column-gap:8px;padding:0 8px 2px;border-radius:8px;transition:background .15s ease,opacity .15s ease}
.at:hover{background:var(--sf2)}
.at-rank{width:18px;height:18px;display:flex;align-items:center;justify-content:center;border-radius:50%;border:1.5px solid var(--c);background:#FFFFFF;color:var(--ink2);font-size:9px;font-weight:700}
.at-id{min-width:0;display:flex;align-items:baseline;gap:6px;white-space:nowrap;overflow:hidden}
.at-id b{font-size:12.5px;font-weight:700;color:var(--ink)}
.at-id small{min-width:0;overflow:hidden;text-overflow:ellipsis;color:var(--mut);font-size:8.5px;font-weight:600;letter-spacing:.07em}
.at-pts{font-size:11.5px;font-weight:650;color:var(--ink2);white-space:nowrap}
.at-pts small{margin-left:3px;color:var(--mut);font-size:9px;font-weight:500}
.at .pill{min-width:0;width:60px;height:17px;font-size:10px}
.at-bar{position:absolute;left:34px;right:8px;bottom:0;height:2px;border-radius:99px;background:var(--ln)}
.at-bar::after{content:'';position:absolute;left:76.9%;top:-2px;bottom:-1px;width:1.5px;margin-left:-.75px;border-radius:2px;background:var(--ink);opacity:.32}
.at-bar u{background:var(--c);opacity:.8}
/* AT selecionada no filtro: destacada e sempre visivel (gruda no topo/rodape ao rolar) */
.at.selected{position:sticky;top:0;bottom:0;z-index:2;background:#F4F3FF;box-shadow:inset 0 0 0 1px #D9D4FA}
.ats.focus .at:not(.selected){opacity:.55}
.ats.focus .at:hover{opacity:1}
.empty{margin:auto;padding:24px 16px;text-align:center;color:var(--mut);font-size:11px;line-height:1.4}
.empty b{display:block;margin-bottom:4px;color:var(--ink);font-size:12.5px;font-weight:650}

/* ---------- SCROLLBARS ---------- */
.rows::-webkit-scrollbar,.ats::-webkit-scrollbar{width:7px}
.rows::-webkit-scrollbar-track,.ats::-webkit-scrollbar-track{background:transparent}
.rows::-webkit-scrollbar-thumb,.ats::-webkit-scrollbar-thumb{background:#D5DAE2;border-radius:99px}

/* ---------- ANIMACOES (so na entrada, ao trocar o filtro) ---------- */
@keyframes grow{from{transform:scaleX(0)}}
@keyframes ring{from{stroke-dasharray:0 100}}

/* ---------- RESPONSIVO / ACESSIBILIDADE ---------- */
@media (max-width:1100px){.score{font-size:23px}.hero .score{font-size:27px}.card{padding:10px 11px 9px}.gauge{width:56px;height:56px}.legend{gap:8px}}
@media (max-width:960px){.bsc{--cols:minmax(0,1fr) 72px 72px 64px 70px}.legend,.bul,.card-sub,.card-foot .vs{display:none}.content{grid-template-columns:minmax(0,1.5fr) minmax(236px,.8fr)}.gauge{width:48px;height:48px}.gauge-v{font-size:12px}}
@media (max-width:700px){.content{grid-template-columns:minmax(0,1fr)}.content aside{display:none}.cards{grid-template-columns:repeat(5,minmax(0,1fr))}.gauge,.card-foot .vs{display:none}}
@media (max-height:460px){.card-foot{display:none}.track{margin-top:8px}.gauge{width:48px;height:48px}}
@media (prefers-reduced-motion:reduce){.bsc *{animation:none!important;transition:none!important}}
