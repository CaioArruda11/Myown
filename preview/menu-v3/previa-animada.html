<!doctype html><html><head><meta charset='utf-8'></head><body style='margin:0;background:#E9EFF7'><style>
html,body{margin:0;padding:0;width:100%;height:100vh;overflow:hidden;background:transparent}
.mn,.mn *{box-sizing:border-box}
.mn i{font-style:normal}
/* Fonte igual a da versao anterior: a altura do cabecalho depende dela e
   define onde os itens comecam (alinhamento com os botoes nativos). */
.mn{width:100%;height:100vh;font-family:'Segoe UI',Arial,sans-serif;-webkit-font-smoothing:antialiased}

/* ---------- CAIXA ---------- */
.sb{position:relative;width:100%;height:100%;padding:18px 14px;display:flex;flex-direction:column;overflow:hidden;color:#FFFFFF;border-radius:22px;
background:linear-gradient(180deg,#3F3F96 0%,#34347F 45%,#262764 100%);box-shadow:0 16px 32px rgba(31,33,92,.30),inset 0 1px 0 rgba(255,255,255,.10)}
.sb:before{content:'';position:absolute;top:-80px;right:-70px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(120,202,255,.22),transparent 70%);pointer-events:none}
.sb:after{content:'';position:absolute;bottom:-90px;left:-60px;width:190px;height:190px;border-radius:50%;background:radial-gradient(circle,rgba(122,102,230,.24),transparent 70%);pointer-events:none}

/* ---------- MARCA (mesmas medidas da versao anterior) ---------- */
.brand{position:relative;padding:6px 6px 18px;border-bottom:1px solid rgba(255,255,255,.12)}
.brand b{font-size:21px;font-weight:800;letter-spacing:-.02em;white-space:nowrap}
.brand b span{margin-left:.2em;background:linear-gradient(92deg,#8ED6FF,#C2B3FF);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.brand small{display:block;margin-top:6px;font-size:9px;font-weight:700;letter-spacing:.16em;color:rgba(255,255,255,.55);white-space:nowrap}

/* ---------- ITENS (36px de altura, 7px entre eles: nao alterar) ---------- */
.nav{position:relative;display:grid;gap:7px;margin-top:20px}
.it{position:relative;height:36px;display:flex;align-items:center;gap:10px;padding:0 12px;border-radius:11px;color:rgba(255,255,255,.66);isolation:isolate;overflow:hidden}
.ic{flex:none;width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;opacity:.85}
.lb{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12.5px;font-weight:600;letter-spacing:.005em}
.dv{position:absolute;left:12px;right:12px;height:1px;background:rgba(255,255,255,.09)}

/* pagina atual */
.it.on{color:#FFFFFF;background:linear-gradient(135deg,#6E9BF0 0%,#7A66E6 100%);box-shadow:0 8px 18px rgba(40,34,150,.38),inset 0 1px 0 rgba(255,255,255,.22)}
.it.on .ic{opacity:1}
.it.on .lb{font-weight:700}
/* contorno de luz que gira devagar (unica animacao continua do menu) */
.it.on:before{content:'';position:absolute;z-index:-2;inset:-150%;background:conic-gradient(from 0deg,transparent 0 72%,rgba(255,255,255,.0) 74%,rgba(217,245,255,.95) 86%,transparent 96%);animation:beam 4.5s linear infinite}
.it.on:after{content:'';position:absolute;z-index:-1;inset:1.5px;border-radius:9.5px;background:linear-gradient(135deg,#6E9BF0 0%,#7A66E6 100%)}
/* brilho que atravessa o item a cada poucos segundos */
.it.on .lb:after{content:'';position:absolute;top:0;bottom:0;left:-40%;width:34%;transform:skewX(-18deg);background:linear-gradient(90deg,transparent,rgba(255,255,255,.22),transparent);animation:sheen 5.5s ease-in-out infinite}
.here{flex:none;width:6px;height:6px;margin-left:auto;border-radius:50%;background:#FFFFFF;box-shadow:0 0 0 3px rgba(255,255,255,.18),0 0 10px rgba(217,245,255,.9)}
@keyframes beam{to{transform:rotate(360deg)}}
@keyframes sheen{0%,55%{left:-40%;opacity:0}62%{opacity:1}85%,100%{left:120%;opacity:0}}

/* ---------- CONTEXTO (filtros ativos) ---------- */
.ctx{position:relative;margin-top:auto;padding:12px 12px 13px;border-radius:15px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(6px)}
.ctx-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:9px;font-size:9px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.55)}
.ctx-h b{padding:2px 7px;border-radius:99px;background:rgba(120,202,255,.22);color:#D9F1FF;font-size:9px;letter-spacing:.04em;text-transform:none}
.kv{display:flex;flex-direction:column;gap:2px;padding:6px 0;border-top:1px solid rgba(255,255,255,.08)}
.kv:first-of-type{border-top:none;padding-top:0}
.kv small{font-size:9px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.5)}
.kv b{display:flex;align-items:center;gap:7px;min-width:0;overflow:hidden;font-size:13px;font-weight:700;color:#FFFFFF;white-space:nowrap;text-overflow:ellipsis}
.kv b.mu{color:rgba(255,255,255,.55);font-weight:600}
.sw{flex:none;width:10px;height:10px;border-radius:50%;background:#78CAFF;box-shadow:0 0 0 2px rgba(255,255,255,.85),0 0 10px #78CAFF}

/* ---------- MENU ESTREITO: so icones ---------- */
@media (max-width:120px){.sb{padding:18px 8px}.brand b,.brand small{visibility:hidden}.it{justify-content:center;padding:0}.lb,.here{display:none}.ctx{display:none}}
@media (prefers-reduced-motion:reduce){.mn *{animation:none!important}}
</style><div class='mn'><aside class='sb'><div class='brand'><b>Indicadores<span>ARF</span></b><small>BSC OPERACIONAL</small></div><nav class='nav'><div class='it'><svg class='ic' viewBox='0 0 24 24' aria-hidden='true'><circle cx='12' cy='12' r='9'/><circle cx='12' cy='12' r='5'/><circle cx='12' cy='12' r='1.2'/></svg><span class='lb'>BSC</span></div><div class='it'><svg class='ic' viewBox='0 0 24 24' aria-hidden='true'><path d='M4 11l8-6.5 8 6.5v8.5a1 1 0 0 1-1 1h-4.5v-5.5h-5V21H5a1 1 0 0 1-1-1z'/></svg><span class='lb'>IFI</span></div><div class='it on'><svg class='ic' viewBox='0 0 24 24' aria-hidden='true'><path d='M17 2.5l3 3-3 3'/><path d='M4 11V9.5a4 4 0 0 1 4-4h12'/><path d='M7 21.5l-3-3 3-3'/><path d='M20 13v1.5a4 4 0 0 1-4 4H4'/></svg><span class='lb'>IRR</span><i class=here></i></div><div class='it'><svg class='ic' viewBox='0 0 24 24' aria-hidden='true'><circle cx='12' cy='13' r='8'/><path d='M12 9v4l2.5 2'/><path d='M9.5 2.5h5'/></svg><span class='lb'>TDNA Instalação</span></div><div class='it'><svg class='ic' viewBox='0 0 24 24' aria-hidden='true'><path d='M15.5 3.5a4.5 4.5 0 0 0-4.3 5.8L4 16.5a2.1 2.1 0 0 0 3 3l7.2-7.2a4.5 4.5 0 0 0 5.8-4.3l-2.7 2.7-2.6-.4-.4-2.6z'/></svg><span class='lb'>TDNA Reparos</span></div><div class='it'><svg class='ic' viewBox='0 0 24 24' aria-hidden='true'><rect x='9' y='3' width='6' height='5' rx='1.2'/><rect x='3' y='16' width='6' height='5' rx='1.2'/><rect x='15' y='16' width='6' height='5' rx='1.2'/><path d='M12 8v4M6 16v-2a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v2'/></svg><span class='lb'>Abertura Hierarquia</span></div><i class='dv' style='top:125px'></i><i class='dv' style='top:211px'></i></nav><div class='ctx'><div class='ctx-h'><span>Contexto</span></div><div class='kv'><small>Cluster</small><b>PERUS / BUTANTÃ</b></div><div class='kv'><small>Cor</small><b><i class='sw'></i>GERAL</b></div><div class='kv'><small>AT</small><b class=mu>Todas</b></div></div></aside></div></body></html>
