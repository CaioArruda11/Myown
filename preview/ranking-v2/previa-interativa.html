/* ---- resumo do grupo + histograma ---- */
.kp{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr) minmax(0,1fr)}
.kp div{min-width:0;padding:0 0 0 8px;border-left:1px solid rgba(255,255,255,.11)}
.kp div:first-child{padding-left:0;border-left:none}
.kp small{display:flex;align-items:center;gap:4px;overflow:hidden;text-overflow:ellipsis;font-size:8px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:rgba(255,255,255,.62);white-space:nowrap}
.kp small i{flex:none;width:6px;height:6px;border-radius:50%;background:var(--s)}
.kp b{display:block;margin-top:2px;font-size:19px;font-weight:700;letter-spacing:-.02em;line-height:1;white-space:nowrap}
.hg{position:relative;display:grid;grid-template-columns:repeat(9,minmax(0,1fr));column-gap:3px;height:66px;margin-top:6px}
.hb{position:relative;min-width:0;display:grid;grid-template-rows:11px minmax(0,1fr) 11px;text-align:center}
.hb b{font-size:8.5px;font-weight:700;line-height:11px;color:rgba(255,255,255,.85)}
.hb.z b{color:rgba(255,255,255,.35)}
.hb i{position:relative;border-bottom:1px solid rgba(255,255,255,.22)}
.hb u{position:absolute;left:0;right:0;bottom:0;height:var(--h,0%);min-height:2px;border-radius:3px 3px 0 0;background:var(--s);transform-origin:50% 100%;animation:rise .8s var(--ease) both}
.hb.z u{background:rgba(255,255,255,.20)}
.hb small{font-size:7.5px;line-height:11px;color:rgba(255,255,255,.60);white-space:nowrap}
/* linha tracejada entre 90-99 e 100-109: separa quem esta na meta */
.hg>.v:nth-child(7) .hb::before{content:'';position:absolute;left:-2px;top:9px;bottom:11px;border-left:1px dashed rgba(255,255,255,.75)}

/* =====================================================================
   PAINEL DO RANKING
   ===================================================================== */
.panel{position:relative;min-width:0;min-height:0;display:flex;flex-direction:column;overflow:hidden;border-radius:16px;background:var(--sf);border:1px solid var(--ln);box-shadow:0 1px 2px rgba(11,21,51,.04),0 6px 16px rgba(11,21,51,.05)}
.ph{position:relative;z-index:40;flex:none;display:flex;align-items:center;gap:8px;height:44px;padding:0 12px 0 16px;border-bottom:1px solid var(--ln2)}
.ph h2{flex:none;margin:0;font-size:14px;font-weight:700;letter-spacing:-.01em;line-height:1.2;color:var(--ink);white-space:nowrap}
.cx{flex:none;display:inline-flex;align-items:center;height:18px;padding:0 8px;border-radius:99px;background:var(--pri-b);color:var(--pri);font-size:9.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap}
.ins{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;font-size:10.5px;color:var(--mut);white-space:nowrap}

/* botao de duas posicoes (<details>): fechado = 1a opcao, aberto = 2a */
.tg{flex:none}
.tg summary{display:flex;padding:2px;border-radius:9px;background:var(--sf2);border:1px solid var(--ln);cursor:pointer;outline:none;-webkit-user-select:none;user-select:none}
.tg span{display:flex;align-items:center;height:20px;padding:0 9px;border-radius:7px;font-size:10.5px;font-weight:650;color:var(--mut);white-space:nowrap;transition:background .15s ease,color .15s ease}
.tg:not([open]) .a,.tg[open] .b{background:var(--sf);color:var(--pri);box-shadow:0 1px 2px rgba(11,21,51,.14)}
.tg summary:hover span{color:var(--ink)}
.tg summary:focus-visible{outline:2px solid var(--pri);outline-offset:1px}

/* ajuda (?): abre com o mouse em cima ou com um clique (foco) */
.help{position:relative;flex:none;outline:none}
.help-b{width:22px;height:22px;display:flex;align-items:center;justify-content:center;border-radius:50%;border:1px solid var(--ln);background:var(--sf2);color:var(--ink2);font-size:11px;font-weight:700;cursor:help;transition:background .15s ease,color .15s ease,border-color .15s ease}
.help:hover .help-b,.help:focus-within .help-b{background:var(--pri);border-color:var(--pri);color:#FFFFFF}
.help-pop{position:absolute;right:0;top:29px;width:300px;padding:12px 13px 11px;border-radius:12px;background:var(--d0);color:#D5DBEA;box-shadow:0 12px 28px rgba(5,14,38,.34);font-size:10.5px;line-height:1.4;opacity:0;visibility:hidden;transform:translateY(-4px);transition:opacity .16s ease,transform .16s ease,visibility .16s}
.help:hover .help-pop,.help:focus-within .help-pop{opacity:1;visibility:visible;transform:none}
.help-pop b{display:block;margin-bottom:6px;color:#FFFFFF;font-size:11.5px;font-weight:700}
.help-pop p{margin:0 0 6px}
.help-pop .k{display:block;color:var(--a1);font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.help-esc{display:flex;gap:4px;margin:9px 0 0!important}
.help-esc .e{flex:1 1 0;height:18px;display:flex;align-items:center;justify-content:center;border-radius:5px;background:var(--sb);color:var(--st);font-size:9.5px;font-weight:700}

/* ---------- CABECALHO DAS COLUNAS + LINHAS ---------- */
.gh,.row{display:grid;grid-template-columns:var(--cols);align-items:center;column-gap:6px}
.gh{flex:none;height:32px;padding:0 21px 0 14px;background:var(--sf2);border-bottom:1px solid var(--ln);color:var(--mut);font-size:8.5px;font-weight:700;letter-spacing:.07em;line-height:1.25;text-transform:uppercase;text-align:center;white-space:nowrap}
.gh span:nth-child(2){text-align:left}
.gh small{display:block;color:#8E99AE;font-size:8.5px;font-weight:600;letter-spacing:0;text-transform:none}
.rows{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;padding:4px 6px 6px 8px;overflow-y:scroll;overflow-x:hidden;scrollbar-width:thin;scrollbar-color:#C5CCDA var(--sf2)}
.rows::-webkit-scrollbar{width:7px}
.rows::-webkit-scrollbar-track{background:var(--sf2);border-radius:99px}
.rows::-webkit-scrollbar-thumb{background:#C5CCDA;border-radius:99px}
.row{position:relative;flex:none;height:33px;padding:0 8px 0 6px;border-bottom:1px solid var(--ln2);border-radius:9px;transition:background .15s ease}
.row:hover{background:var(--sf2)}
.pos{width:26px;height:22px;display:flex;align-items:center;justify-content:center;border-radius:7px;background:var(--sf2);color:var(--ink2);font-size:10.5px;font-weight:700}
.pos.m1{color:#FFFFFF;background:#D7A21B}.pos.m2{color:#FFFFFF;background:#8EA1B8}.pos.m3{color:#FFFFFF;background:#B8784E}
.who{min-width:0;display:flex;align-items:center;gap:8px}
.av{flex:none;width:25px;height:25px;display:flex;align-items:center;justify-content:center;border-radius:50%;color:#FFFFFF;font-size:9.5px;font-weight:700;line-height:1;letter-spacing:.02em}
.a0{background:#475569}.a1{background:#0284C7}.a2{background:#7C3AED}.a3{background:#0F766E}.a4{background:#BE185D}.a5{background:#4F46E5}
.nm{min-width:0}
.nm b{display:block;overflow:hidden;text-overflow:ellipsis;font-size:12px;font-weight:650;line-height:1.2;color:var(--ink);white-space:nowrap}
.nm small{display:block;margin-top:1px;overflow:hidden;text-overflow:ellipsis;font-size:8.5px;font-weight:500;line-height:1.2;color:var(--mut);white-space:nowrap}
/* celula do indicador: cor = status; sem dado vira um traco discreto */
.ic{position:relative;height:23px;display:flex;align-items:center;justify-content:center;border-radius:7px;background:var(--sb);color:var(--st);font-size:11px;font-weight:700;white-space:nowrap;cursor:default}
.ic.tN{background:transparent;color:#B7BFCE;font-weight:500}
.tt{display:none;position:absolute;z-index:30;right:calc(100% + 7px);top:50%;transform:translateY(-50%);padding:6px 9px;border-radius:8px;background:var(--d0);box-shadow:0 6px 18px rgba(5,14,38,.30);color:#B9C3D8;font-size:10px;font-weight:500;line-height:1.5;text-align:left;white-space:nowrap;pointer-events:none}
.tt::after{content:'';position:absolute;left:100%;top:50%;margin-top:-5px;border:5px solid transparent;border-left-color:var(--d0)}
.tt i{display:flex;justify-content:space-between;gap:14px}
.tt b{color:#FFFFFF;font-weight:700}
.ic:hover .tt{display:block}
/* cobertura: n de 5 indicadores com dado */
.cv{text-align:center;color:var(--ink2);font-size:10px;font-weight:650;--f:0%;--k:var(--ink2)}
.cv::after{content:'';display:block;width:30px;height:3px;margin:2px auto 0;border-radius:2px;background:linear-gradient(90deg,var(--k) 0 var(--f),var(--ln) var(--f) 100%)}
.n1{--f:20%}.n2{--f:40%}.n3{--f:60%}.n4{--f:80%}.n5{--f:100%}
.cv.n1,.cv.n2{color:#8A6100;--k:#E0A100}
.pts{min-width:0;display:flex;flex-wrap:wrap;align-items:baseline;justify-content:flex-end;column-gap:2px;white-space:nowrap}
.pts b{font-size:12.5px;font-weight:700;color:var(--ink)}
.pts small{font-size:9.5px;font-weight:500;color:var(--mut)}
.trk{position:relative;flex:0 0 100%;height:4px;margin-top:2px;border-radius:99px;background:var(--ln2)}
.trk u{display:block;width:var(--w,0%);max-width:100%;height:100%;border-radius:99px;background:var(--s)}
.trk::after{content:'';position:absolute;left:76.9%;top:-2px;bottom:-2px;width:1.5px;margin-left:-.75px;background:var(--ink);opacity:.45}
.hit{height:22px;display:flex;align-items:center;justify-content:center;border-radius:7px;background:var(--sb);color:var(--st);font-size:11px;font-weight:700;white-space:nowrap}
.row.low::before{content:'';position:absolute;left:0;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;background:#E5383B}
/* linha selecionada no filtro: destacada e sempre visivel (gruda no topo/rodape ao rolar) */
.row.sel{position:sticky;top:0;bottom:0;z-index:5;background:var(--pri-b);box-shadow:inset 0 0 0 1.5px var(--pri);border-bottom-color:transparent}
.empty{margin:auto;padding:30px 16px;text-align:center;color:var(--mut);font-size:11px;line-height:1.4}
.empty b{display:block;margin-bottom:4px;color:var(--ink);font-size:12.5px;font-weight:700}

/* ---------- ESTADO DOS BOTOES ---------- */
/* Piores: inverte a ordem da lista */
.panel:has(.tg-ord[open]) .row{order:var(--o)}
/* Criticos: mostra so quem esta abaixo de 80% (e a linha selecionada) */
.panel:has(.tg-crit[open]) .row:not(.low):not(.sel){display:none}
/* navegador sem :has(): esconde os botoes e fica na visao padrao */
@supports not selector(:has(a)){.tg{display:none}}

/* ---------- ANIMACOES (so na entrada) ---------- */
@keyframes grow{from{transform:scaleX(0)}}
@keyframes rise{from{transform:scaleY(0)}}
@keyframes arc{from{stroke-dasharray:0 600}}
@keyframes drift{0%,55%{left:-30%}100%{left:125%}}

/* ---------- OUTROS TAMANHOS / ACESSIBILIDADE ---------- */
@media (max-width:980px){.rk{--cols:26px minmax(140px,1fr) repeat(5,62px) 36px 96px 70px}.av{display:none}.ins{display:none}.hero{grid-template-columns:minmax(0,1fr) minmax(0,1.2fr)}.hero .hz:nth-child(3){display:none}}
@media (max-width:760px){.rk{--cols:24px minmax(110px,1fr) repeat(5,52px) 86px 64px}.cv{display:none}.gh span:nth-child(8){display:none}.hero{grid-template-columns:minmax(0,1fr)}.hero .hz:nth-child(2){display:none}.ic{font-size:10px}}
@media (max-height:520px){.hero{padding:9px 4px}.gauge{width:150px;height:84px}.g-v b{font-size:25px}.hg{height:52px}.row{height:31px}}
@media (prefers-reduced-motion:reduce){.rk *,.rk *::before,.rk *::after{animation:none!important;transition:none!important}}
